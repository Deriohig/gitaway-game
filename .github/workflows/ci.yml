# Type-check, unit tests and production build, and the Rust tests for the
# desktop shell's git-activity crate.
#
# The rust job runs the crate's tests against throwaway repositories created in
# the runner's temp folder, so no real repository or network is involved.
#
# The Playwright e2e suite doesn't run here. It runs on the developer's machine
# before each push that changes the game: the pre-push hook in .githooks runs
# `npm run check:push` (types, unit tests and both e2e projects). See "What
# runs where" in the README.
#
# Actions are pinned by full commit SHA.

name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node (.nvmrc)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install npm packages
        timeout-minutes: 5
        run: npm ci --no-audit --no-fund

      - name: Type-check
        run: npm run type-check

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

  rust:
    name: rust (git-activity)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show the Rust and Git versions
        run: |
          rustc --version
          cargo --version
          git --version

      # Only the std-only git-activity crate is built here. The Tauri app crate
      # needs system webview libraries and is built by the desktop workflow.
      - name: Test the git-activity crate
        run: cargo test --manifest-path src-tauri/Cargo.toml -p git-activity
