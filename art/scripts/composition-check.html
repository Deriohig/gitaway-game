const counts = {};
const jobs = [];

    counts[id][cat] = P[cat].length;
    for (const [asset, list] of Object.entries(by)) jobs.push(instance(PG[id], pc, FILE(asset), list, { cast: cat === 'trees', colours: list.some((q) => q.tint || q.color), name: `${cat}:${asset}:${id}` })); } }

  const hash01 = (x, z) => GT.hash3(Math.round(x * 100), Math.round(z * 100), 77), main = PC.main, M = COMP.pieces.main, loc = (pc, x, z) => [x - pc.pivot[0], z - pc.pivot[2]];

  for (const t of M.trees.filter((q) => q.layout && q !== heroT)) jobs.push(instance(PG.main, main, MODELS + VA[t.variant] + '.glb', [{ x: t.x, z: t.z, rotY: t.rot + (t.vyaw || 0), scale: t.scale * (t.vscale || 1) }], { cast: true }));

  for (const r of M.rocks) { const c = hash01(r.x + 0.37, r.z - 0.11) < 0.34; jobs.push(instance(PG.main, main, PROOF + (c ? 'boulder_c' : r.kind) + '.wasm', [{ x: r.x, z: r.z, rotY: r.rot, scale: r.scale, yOff: c ? -0.02 : -0.04 }])); }
  // (no fences: the game removed them)

    ['bench', 'main', at(G.BENCH), G.BENCH.rot || 0, 1, [1.15, 0.62]], ['haystack', 'meadow', Z.meadow.find((q) => q.id === 'haystack_a').at, 0.35, 1, [1.2, 1.2]], ['haystack', 'meadow', Z.meadow.find((q) => q.id === 'haystack_b').at, 2.2, 1, [1.2, 1.2]],
    ['cart', 'meadow', [5.75, 12.25], 2.5, 1, [1.0, 1.45]], ['outcrop_a', 'highland', [-6.39, -15.81], 0.384, 1, [2.0, 1.8]], ['outcrop_b', 'highland', [-13.03, -10.18], 2.48, 0.85, [2.4, 3.2]], ['outcrop_a', 'islet', [24.28, 0.0], 1.571, 0.9, [1.8, 1.6]]];

    for (const f of [0.5, 1]) for (let k = 0; k < 16; k++) { const t = k / 16 * Math.PI * 2, lx = Math.cos(t) * rx * 0.42 * f, lz = Math.sin(t) * rz * 0.42 * f; lo = Math.min(lo, pc.height(x + lx * Math.cos(rot) + lz * Math.sin(rot), z - lx * Math.sin(rot) + lz * Math.cos(rot)) - g0); }

  const pond = []; if (J.main.pond.r == null) pond.push(...J.main.pond.outline); else for (let i = 0; i < 40; i++) { const t = i / 40 * Math.PI * 2; pond.push([J.main.pond.at[0] + Math.cos(t) * J.main.pond.r, J.main.pond.at[1] + Math.sin(t) * J.main.pond.r]); }

  ribbon('main', (J.main.stream.line || J.main.stream.points).map((p) => ({ x: p.x, z: p.z, width: p.width || 0.45, level: p.level }))); ribbon('wetland', J.wetland.river.points); ribbon('wetland', J.wetland.outflow.points.filter((p) => BP.dcAt(p.x, p.z) > 0.02));

// ---- path ribbons: added to the piece groups as is (piece-local, on the baked top + their lift); one node per run (path_<runId>),

const RUNS = [];
